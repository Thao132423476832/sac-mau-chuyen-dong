<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sắc màu của em</title><link rel="stylesheet" href="/games/sac-mau/style.css"></head><body class="tv"><canvas id="stage"></canvas><div class="overlay"><div class="brand" id="worldTitle">🎨 SẮC MÀU CỦA EM</div><div class="counter" id="counter">0 tác phẩm</div><div class="qr-card"><img id="qr"><strong>📱 Quét để vẽ</strong></div><div class="controls"><button id="home">🏠 Trang chủ</button><button id="fullscreen">⛶ Toàn màn hình</button><button id="clear">Xóa tranh</button></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io();socket.emit('tv:join');const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),counter=document.getElementById('counter'),worldTitle=document.getElementById('worldTitle');let sprites=[],particles=[],world='ocean';const worlds={ocean:{name:'🌊 Đại dương sắc màu',a:'#04324f',b:'#0a7898'},forest:{name:'🌳 Khu rừng kỳ diệu',a:'#0a3022',b:'#4f884f'},city:{name:'🏙️ Thành phố tương lai',a:'#11162d',b:'#55469a'},space:{name:'🚀 Vũ trụ Chính Nghĩa',a:'#050510',b:'#422760'}};fetch('/games/sac-mau/api/qr').then(r=>r.json()).then(d=>document.getElementById('qr').src=d.qr);function resize(){const d=Math.max(1,devicePixelRatio||1);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);particles=Array.from({length:55},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:1+Math.random()*3,s:.1+Math.random()*.3,a:.1+Math.random()*.35}))}addEventListener('resize',resize);resize();function resolve(w,t,img){if(t&&t!=='auto')return t;if(w==='ocean')return'fish';if(w==='space')return'fly';if(w==='city')return'walk';return img.width/img.height>1.1?'bird':'walk'}socket.on('artwork:new',d=>{world=d.world||'ocean';worldTitle.textContent=worlds[world].name;const img=new Image();img.onload=()=>{const max=Math.min(300,innerWidth*.23),ratio=img.width/img.height;let w=max,h=max/ratio;if(h>max*1.4){h=max*1.4;w=h*ratio}const type=resolve(world,d.motionType,img);let y=100+Math.random()*Math.max(20,innerHeight-h-220);if(type==='walk')y=innerHeight-h-70;sprites.push({img,type,x:40+Math.random()*Math.max(20,innerWidth-w-80),y,w,h,vx:(.5+Math.random()*.5)*(Math.random()<.5?-1:1),vy:.1+Math.random()*.2,p:Math.random()*6.28,homeY:y});counter.textContent=`${sprites.length} tác phẩm`};img.src=d.imageData});socket.on('tv:clear',()=>{sprites=[];counter.textContent='0 tác phẩm'});home.onclick=()=>location.href='/';clear.onclick=()=>socket.emit('tv:clear');fullscreen.onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()};function bg(){const q=worlds[world],g=ctx.createLinearGradient(0,0,innerWidth,innerHeight);g.addColorStop(0,q.a);g.addColorStop(1,q.b);ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);for(const p of particles){p.y-=p.s;if(p.y<-5)p.y=innerHeight+5;ctx.globalAlpha=p.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function draw(s){s.p+=.03;s.x+=s.vx;if(s.x<0||s.x+s.w>innerWidth)s.vx*=-1;if(s.type==='walk')s.y=s.homeY+Math.abs(Math.sin(s.p*2))*5;else s.y=s.homeY+Math.sin(s.p)*14;ctx.save();ctx.translate(s.x+s.w/2,s.y+s.h/2);if(s.vx<0)ctx.scale(-1,1);ctx.drawImage(s.img,-s.w/2,-s.h/2,s.w,s.h);ctx.restore()}function loop(){bg();sprites.forEach(draw);requestAnimationFrame(loop)}loop();
</script></body></html>
