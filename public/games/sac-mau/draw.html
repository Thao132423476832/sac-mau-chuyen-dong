<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Sắc màu của em - Bảng vẽ</title><link rel="stylesheet" href="/games/sac-mau/style.css"></head><body class="draw-page"><div class="wrap"><div class="header"><button id="homeBtn" class="draw-home">🏠 Trang chủ</button><h1>🎨 SẮC MÀU CỦA EM</h1><p>Vẽ nhân vật rồi gửi lên màn hình TV.</p></div><div class="main-grid"><aside><section class="panel"><div class="label">1. Chọn thế giới</div><div class="worlds"><button class="world active" data-world="ocean">🌊 Đại dương</button><button class="world" data-world="forest">🌳 Khu rừng</button><button class="world" data-world="city">🏙️ Thành phố</button><button class="world" data-world="space">🚀 Vũ trụ</button></div></section><section class="panel"><div class="label">2. Chọn chuyển động</div><div class="motions"><button class="motion active" data-motion="auto">✨ Tự động</button><button class="motion" data-motion="fish">🐟 Cá bơi</button><button class="motion" data-motion="bird">🐦 Chim bay</button><button class="motion" data-motion="walk">🐾 Đi</button><button class="motion" data-motion="fly">🪽 Bay</button></div></section></aside><main><section class="panel"><div class="toolbar"><button id="penBtn" class="tool active">🖊 Bút</button><button id="eraserBtn" class="tool">🧽 Tẩy</button><button id="undoBtn" class="tool">↶ Hoàn tác</button><button id="clearBtn" class="tool">🗑 Xóa hết</button></div><div class="colors" id="colors"></div><div class="size-row"><span>Nét nhỏ</span><input id="sizeRange" type="range" min="2" max="50" value="12"><span id="sizeText">12</span></div><div class="paper-title">✍️ VẼ NHÂN VẬT Ở ĐÂY</div><div class="paper"><canvas id="drawCanvas" width="1200" height="900"></canvas></div><button id="sendBtn" class="send">✨ CHO NHÂN VẬT SỐNG DẬY</button><div id="status" class="status">Chạm vào vùng giấy trắng và bắt đầu vẽ.</div><div class="hint">Khi gửi lên TV, nền trắng sẽ được bỏ và chỉ giữ nét vẽ.</div></section></main></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});homeBtn.onclick=()=>location.href='/';let world='ocean',motionType='auto',tool='pen',color='#111827',brushSize=12,drawing=false,lastX=0,lastY=0,history=[];const palette=['#111827','#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#92400e','#ffffff'],colors=document.getElementById('colors');palette.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='color'+(i===0?' active':'');b.style.background=c;if(c==='#ffffff')b.style.border='3px solid #94a3b8';b.onclick=()=>{document.querySelectorAll('.color').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=c;tool='pen';refresh()};colors.appendChild(b)});document.querySelectorAll('.world').forEach(b=>b.onclick=()=>{document.querySelectorAll('.world').forEach(x=>x.classList.remove('active'));b.classList.add('active');world=b.dataset.world});document.querySelectorAll('.motion').forEach(b=>b.onclick=()=>{document.querySelectorAll('.motion').forEach(x=>x.classList.remove('active'));b.classList.add('active');motionType=b.dataset.motion});function refresh(){penBtn.classList.toggle('active',tool==='pen');eraserBtn.classList.toggle('active',tool==='eraser')}penBtn.onclick=()=>{tool='pen';refresh()};eraserBtn.onclick=()=>{tool='eraser';refresh()};function save(){if(history.length>=15)history.shift();history.push(canvas.toDataURL())}undoBtn.onclick=()=>{const d=history.pop();ctx.clearRect(0,0,canvas.width,canvas.height);if(d){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d}};clearBtn.onclick=()=>{save();ctx.clearRect(0,0,canvas.width,canvas.height);status.textContent='Đã xóa bảng vẽ.'};sizeRange.oninput=()=>{brushSize=+sizeRange.value;sizeText.textContent=brushSize};function pos(x,y){const r=canvas.getBoundingClientRect();return{x:(x-r.left)*canvas.width/r.width,y:(y-r.top)*canvas.height/r.height}}function begin(x,y){save();drawing=true;const p=pos(x,y);lastX=p.x;lastY=p.y}function move(x,y,pressure=1){if(!drawing)return;const p=pos(x,y);ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=brushSize*Math.max(.35,pressure||1);if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000'}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color}ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();lastX=p.x;lastY=p.y}function end(){drawing=false}canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);begin(e.clientX,e.clientY)};canvas.onpointermove=e=>{if(drawing){e.preventDefault();move(e.clientX,e.clientY,e.pointerType==='pen'?e.pressure:1)}};canvas.onpointerup=end;canvas.onpointercancel=end;function crop(){const img=ctx.getImageData(0,0,canvas.width,canvas.height),d=img.data;let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1;for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){const a=d[(y*canvas.width+x)*4+3];if(a>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}if(maxX<0)return null;const pad=20;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(canvas.width-1,maxX+pad);maxY=Math.min(canvas.height-1,maxY+pad);const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;out.getContext('2d').drawImage(canvas,minX,minY,out.width,out.height,0,0,out.width,out.height);return out.toDataURL('image/png')}sendBtn.onclick=()=>{const data=crop();if(!data){status.textContent='Bạn chưa vẽ gì cả.';return}socket.emit('artwork:new',{world,motionType,imageData:data});status.textContent='✨ Đã gửi! Hãy nhìn lên TV.'};
</script></body></html>
